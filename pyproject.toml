[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "copronome.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # mots de passe factices des tests
# Outils d'exploitation : lancent docker et age du PATH de l'exploitant, arguments en liste (pas de shell).
"exploitation/{sauvegarder,restaurer}.py" = ["S603", "S607"]
