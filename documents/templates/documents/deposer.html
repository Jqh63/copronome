{% extends "base.html" %}
{% block titre %}Déposer un document — Copronome{% endblock %}
{% block contenu %}
<h1>Déposer un document</h1>
<p>Formats acceptés : PDF, PNG, JPEG, Word, Excel, OpenDocument. Le fichier sera téléchargé, jamais affiché dans la page.</p>
<form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button type="submit">Déposer</button></form>
{% endblock %}
