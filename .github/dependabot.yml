version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Django reste sur la branche LTS (CLAUDE.md) : correctifs 5.2.x seulement.
      # La montée vers la LTS suivante (6.2) se fait à la main.
      - dependency-name: django
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Même Python que la CI : la montée de version mineure se fait à la main.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Une version majeure de Postgres impose une migration des données.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
