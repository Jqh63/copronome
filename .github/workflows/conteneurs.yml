name: Conteneurs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conteneurs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Essai du compose.yaml (build, démarrage, sonde, journal, rappels)
        run: docker/essai-conteneurs.sh
