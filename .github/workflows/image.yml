name: Image

# Construit l'image de l'app et la publie sur GHCR (paquet public, comme le
# dépôt) : ghcr.io/jqh63/copronome:sha-<7 premiers caractères du commit>.
# Un tag par commit de main, jamais réécrit : le tag désigne son code par
# construction, sans version à bumper. Le déploiement épingle un tag (et son
# digest) côté hébergeur ; rien ici ne déploie.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag de l'image
        id: meta
        run: echo "image=ghcr.io/jqh63/copronome:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Un relancement manuel sur un commit déjà publié ne réécrit pas le tag.
      # Fail-closed : seul « manifest unknown » vaut absence.
      - name: Refuser un tag déjà publié
        id: tag
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          if out=$(docker manifest inspect "$IMAGE" 2>&1); then
            echo "::notice::$IMAGE déjà publié : build sauté."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$out" in
            *"manifest unknown"*|*"not found"*|*"no such manifest"*) echo "tag libre : $IMAGE" ;;
            *) echo "::error::vérification du tag impossible : $out"; exit 1 ;;
          esac

      - name: Construction et publication
        if: steps.tag.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          # Relie le paquet au dépôt (visibilité, page du paquet).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
