# Une instance Copronome (une copropriété) : app (gunicorn), rappels
# quotidiens, migrations. Configuration par un fichier d'environnement (modèle :
# env.exemple ; sur un serveur, celui d'exploitation/creer.py) ; les trois
# secrets sont obligatoires, compose refuse sinon. L'instance ne publie aucun
# port : le frontal (frontal/compose.yaml) joint l'app par le réseau partagé
# `copronome-frontal`, sous l'alias copronome-<id> ; sa base vit dans le
# cluster du serveur (postgres/compose.yaml), joint par le réseau interne
# `copronome-base`. Frontal et cluster démarrent d'abord, la base de
# l'instance est provisionnée avant son premier `up` (README).
#   docker compose -p copronome-<id> --env-file <id>/instance.env up -d --build
#   docker compose -p copronome-<id> --env-file ... run --rm app inviter ...
# Images tierces épinglées par digest.

# Deux rôles Postgres, créés par le provisionnement (exploitation/postgres.py),
# ni l'un ni l'autre superutilisateur : le propriétaire de la base (mot de
# passe COPRONOME_DB_PASSWORD) ne sert qu'au service ponctuel `migrer` ;
# l'app et les rappels tournent sous un rôle restreint (COPRONOME_DB_APP_*),
# sans UPDATE ni DELETE sur les journaux, incapable de retirer un trigger.
# Base et rôles sont nommés par instance (COPRONOME_DB_NAME, COPRONOME_DB_OWNER,
# COPRONOME_DB_APP_USER) : les rôles sont communs à tout le cluster.
x-env: &env
  COPRONOME_SECRET_KEY: ${COPRONOME_SECRET_KEY:?COPRONOME_SECRET_KEY manquant dans .env}
  COPRONOME_ALLOWED_HOSTS: ${COPRONOME_DOMAINE:-localhost}
  COPRONOME_CSRF_TRUSTED_ORIGINS: ${COPRONOME_URL_PUBLIQUE:-https://localhost:8443}
  COPRONOME_URL_PUBLIQUE: ${COPRONOME_URL_PUBLIQUE:-https://localhost:8443}
  COPRONOME_INSTANCE_ID: ${COPRONOME_INSTANCE_ID:-local}
  COPRONOME_TRUSTED_PROXY_COUNT: "1"
  COPRONOME_DB_ENGINE: postgres
  COPRONOME_DB_HOST: copronome-postgres
  COPRONOME_DB_NAME: ${COPRONOME_DB_NAME:-copronome}
  COPRONOME_DOCUMENT_TAILLE_MAX_MO: ${COPRONOME_DOCUMENT_TAILLE_MAX_MO:-20}
  COPRONOME_DOCUMENTS_QUOTA_MO: ${COPRONOME_DOCUMENTS_QUOTA_MO:-2048}
  COPRONOME_EMAIL_FROM: ${COPRONOME_EMAIL_FROM:-copronome@localhost}
  COPRONOME_EMAIL_HOST: ${COPRONOME_EMAIL_HOST:-}
  COPRONOME_EMAIL_PORT: ${COPRONOME_EMAIL_PORT:-587}
  COPRONOME_EMAIL_USER: ${COPRONOME_EMAIL_USER:-}
  COPRONOME_EMAIL_PASSWORD: ${COPRONOME_EMAIL_PASSWORD:-}
  COPRONOME_RAPPELS_INTERVALLE: ${COPRONOME_RAPPELS_INTERVALLE:-86400}
  COPRONOME_GUNICORN_WORKERS: ${COPRONOME_GUNICORN_WORKERS:-2}

x-app: &app
  build: .
  image: copronome:local
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment:
    <<: *env
    COPRONOME_DB_USER: ${COPRONOME_DB_APP_USER:-copronome_app}
    COPRONOME_DB_PASSWORD: ${COPRONOME_DB_APP_PASSWORD:?COPRONOME_DB_APP_PASSWORD manquant dans .env}
  networks: [base, sortie]

services:
  migrer:
    <<: *app
    command: migrer
    restart: "no"
    environment:
      <<: *env
      COPRONOME_DB_USER: ${COPRONOME_DB_OWNER:-copronome}
      COPRONOME_DB_PASSWORD: ${COPRONOME_DB_PASSWORD:?COPRONOME_DB_PASSWORD manquant dans .env}
      COPRONOME_DB_APP_USER: ${COPRONOME_DB_APP_USER:-copronome_app}
    networks: [base]

  app:
    <<: *app
    command: web
    networks:
      base: {}
      sortie: {}
      frontal:
        aliases: ["copronome-${COPRONOME_INSTANCE_ID:-local}"]
    volumes:
      - media:/srv/media
    depends_on:
      migrer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/docker/entrypoint.sh", "sante"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  rappels:
    <<: *app
    command: rappels
    depends_on:
      app:
        condition: service_healthy

networks:
  # Réseau interne du cluster Postgres (postgres/compose.yaml), sans sortie.
  base:
    external: true
    name: copronome-base
  # Sortie de l'app et des rappels (relais mail).
  sortie: {}
  # Réseau du frontal, partagé par les instances du serveur : une app y est
  # joignable par les autres instances, comme par Internet via le frontal.
  frontal:
    external: true
    name: copronome-frontal

volumes:
  media:
